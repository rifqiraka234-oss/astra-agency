<section class="phero" style="min-height:calc(100vh - 64px);display:flex;align-items:center">
  <div class="wrap" style="max-width:520px;width:100%">
    <div style="text-align:center">{{MARK}}</div>
    <h1 class="h1" style="font-size:clamp(34px,4vw,48px);text-align:center;margin-top:22px">Sign in to SotoCat</h1>
    <p style="text-align:center;color:var(--sub-d);margin-top:12px">For agency teams. We'll email you a secure link.</p>
    <div class="card dark" style="margin-top:30px;background:var(--ink3);border-color:var(--line-d)">
      <form class="form" data-simple="in-ok" novalidate>
        <div class="f"><label for="s-email" style="color:#fff">Work email</label><input id="s-email" name="email" type="email" autocomplete="email" required><p class="err">Add the email you use for SotoCat.</p></div>
        <button class="btn btn-blue" type="submit" style="justify-content:center">Email me a sign in link</button>
      </form>
      <div class="ok-box" id="in-ok" role="status"><b>Check your inbox.</b>If <span data-echo="email"></span> has a SotoCat account, the link's on its way.</div>
    </div>
    <p style="text-align:center;color:var(--sub-d);margin-top:22px;font-size:15px">Tenants and contractors sign in through the SotoCat app.<br>New to SotoCat? <a class="lnk" href="start.html" style="color:#4ea8ff">Start 90 days free</a></p>
  </div>
</section>
