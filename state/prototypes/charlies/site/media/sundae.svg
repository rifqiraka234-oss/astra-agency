      <stop offset=".3" stop-color="#e9def5" stop-opacity=".25"/>
      <stop offset=".72" stop-color="#e9def5" stop-opacity=".2"/>
      <stop offset=".86" stop-color="#ffffff" stop-opacity=".5"/>
