<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <!-- A plain whippy sundae, drawn by Astra in the site's glossy style (Charlie's has no photo of one) -->
  <defs>
    <linearGradient id="su-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cbb8e6" stop-opacity=".7"/>
