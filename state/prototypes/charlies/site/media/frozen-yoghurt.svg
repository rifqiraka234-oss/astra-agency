<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <!-- A frozen yoghurt in a striped tub like the ones in Charlie's posts, drawn by Astra in the site's glossy style -->
  <defs>
    <pattern id="fy-stripes" width="44" height="600" patternUnits="userSpaceOnUse">
      <rect width="22" height="600" fill="#5F3F90"/><rect x="22" width="22" height="600" fill="#F75F9B"/>
    </pattern>
    <clipPath id="fy-cup"><path d="M30 388 L 370 388 L 336 584 C 334 594, 326 598, 314 598 L 86 598 C 74 598, 66 594, 64 584 Z"/></clipPath>
    <linearGradient id="fy-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c0638" stop-opacity=".55"/>
      <stop offset=".2" stop-color="#1c0638" stop-opacity=".06"/>
      <stop offset=".32" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#1c0638" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1c0638" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="fy-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6d9f1"/>
    </linearGradient>
    <radialGradient id="fy-swirl" cx=".36" cy=".28" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#fff1f5"/>
      <stop offset="1" stop-color="#e6bfd0"/>
    </radialGradient>
    <linearGradient id="fy-spoon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9cc4"/><stop offset=".5" stop-color="#ffd1e4"/><stop offset="1" stop-color="#f06aa3"/>
    </linearGradient>
  </defs>
  <!-- the swirl, five tiers piled high -->
  <g>
    <path d="M300 214 L 352 92 C 356 82, 368 84, 366 96 L 318 222 Z" fill="url(#fy-spoon)"/>
    <ellipse cx="358" cy="86" rx="14" ry="22" transform="rotate(24 358 86)" fill="url(#fy-spoon)"/>
    <path d="M30 380 C 18 330, 92 304, 200 304 C 308 304, 382 330, 370 380 C 362 404, 304 412, 200 412 C 96 412, 38 404, 30 380 Z" fill="url(#fy-swirl)"/>
    <path d="M58 320 C 50 274, 112 252, 204 254 C 296 256, 352 276, 342 320 C 336 348, 290 356, 202 356 C 114 356, 64 348, 58 320 Z" fill="url(#fy-swirl)"/>
    <path d="M90 264 C 86 224, 140 204, 206 206 C 272 208, 314 226, 306 264 C 300 290, 264 298, 204 298 C 144 298, 96 290, 90 264 Z" fill="url(#fy-swirl)"/>
    <path d="M124 214 C 122 180, 158 164, 206 166 C 254 168, 284 182, 278 214 C 274 236, 246 242, 204 242 C 162 242, 128 236, 124 214 Z" fill="url(#fy-swirl)"/>
    <path d="M158 170 C 158 142, 182 128, 210 130 C 238 132, 254 144, 250 170 C 246 188, 230 194, 206 194 C 182 194, 162 188, 158 170 Z" fill="url(#fy-swirl)"/>
    <path d="M186 136 C 188 108, 206 90, 234 92 C 220 102, 218 116, 228 130 C 236 142, 226 156, 208 156 C 194 156, 186 148, 186 136 Z" fill="url(#fy-swirl)"/>
    <g fill="none" stroke="#c98fa8" stroke-opacity=".5" stroke-width="3" stroke-linecap="round">
      <path d="M50 388 C 120 410, 280 412, 352 384"/><path d="M78 328 C 136 350, 270 352, 324 326"/><path d="M108 270 C 150 288, 256 290, 290 268"/><path d="M140 218 C 172 232, 236 234, 262 216"/><path d="M172 174 C 192 184, 226 186, 240 174"/>
    </g>
    <g fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="5" stroke-linecap="round">
      <path d="M74 336 C 96 318, 136 308, 176 308"/><path d="M104 276 C 122 260, 154 252, 184 252"/><path d="M138 222 C 152 210, 174 204, 194 204"/><path d="M170 176 C 180 166, 194 162, 206 162"/><path d="M196 116 C 202 106, 212 100, 222 98"/>
    </g>
  </g>
  <!-- the striped tub and its rim -->
  <g clip-path="url(#fy-cup)">
    <rect x="20" y="380" width="360" height="230" fill="url(#fy-stripes)"/>
    <rect x="20" y="380" width="360" height="230" fill="url(#fy-shade)"/>
  </g>
  <path d="M22 380 L 378 380 L 374 404 L 26 404 Z" fill="url(#fy-rim)"/>
  <path d="M26 404 L 374 404" stroke="#cbb6e2" stroke-width="2"/>
</svg>
