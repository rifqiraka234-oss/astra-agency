services:
  postgres:
    image: postgres:16-alpine
    container_name: astra-reply-agent-db
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astra_reply_agent
    ports:
      - '5432:5432'
    volumes:
      - astra_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U astra -d astra_reply_agent']
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: astra-reply-agent-worker
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://astra:astra@postgres:5432/astra_reply_agent
    env_file:
      - .env
    ports:
      - '3001:3001'

volumes:
  astra_pgdata:
